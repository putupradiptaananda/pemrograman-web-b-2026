<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      form label {
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <header class="px-3">
      <nav class="navbar navbar-expand-sm py-3">
        <div class="container-fluid px-0">
          <h2 class="navbar-brand fs-1 fw-bold">LibraryReg</h2>
          <button
            class="navbar-toggler bg-primary"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#main-navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse mt-3" id="main-navigation">
            <div class="navbar-nav ms-auto align-items-md-center">
              <a href="../" class="nav-link px-3">Beranda</a>
              <a
                href="../pendaftaran/"
                class="nav-link px-3 text-white rounded bg-primary"
                >Pendaftaran</a
              >
              <a href="../anggota/" class="nav-link px-3">Daftar Anggota</a>
            </div>
          </div>
        </div>
      </nav>
    </header>
    <section class="bg-primary text-white py-5 min-vh-100">
      <div class="container py-5">
        <div class="row align-items-center justify-content-center">
          <div class="col-12 col-lg-8">
            <div class="card">
              <div class="card-body">
                <h3 class="card-title fw-bold mb-4">Formulir Pendaftaran</h3>
                <form id="formDaftar">
                  <label for="inNama" class="form-label">Nama Lengkap</label>
                  <input
                    type="text"
                    class="form-control mb-3"
                    id="inNama"
                    placeholder="Budi"
                    required
                  />
                  <div class="row">
                    <div class="col-12 col-sm-6">
                      <label for="inNIM" class="form-label">NIM/NIP</label>
                      <input
                        type="text"
                        class="form-control mb-3"
                        id="inNIM"
                        placeholder="5025251000"
                        required
                      />
                    </div>
                    <div class="col-12 col-sm-6">
                      <label for="inProdi" class="form-label"
                        >Program Studi</label
                      >
                      <input
                        type="text"
                        class="form-control mb-3"
                        id="inProdi"
                        placeholder="Teknik Informatika"
                        required
                      />
                    </div>
                  </div>
                  <label for="inAlamat" class="form-label">Alamat</label>
                  <input
                    type="text"
                    class="form-control mb-3"
                    id="inAlamat"
                    placeholder="Jl. Raya No. 123"
                    required
                  />
                  <label for="inTlp" class="form-label">Nomor Telepon</label>
                  <input
                    type="text"
                    class="form-control mb-3"
                    id="inTlp"
                    placeholder="+62 812 3456 7890"
                    required
                  />
                  <label for="inEmail" class="form-label">Email</label>
                  <input
                    type="email"
                    class="form-control mb-3"
                    id="inEmail"
                    placeholder="alamat@email.com"
                    required
                  />
                  <label for="inJenis" class="form-label"
                    >Jenis Keanggotaan</label
                  >
                  <select class="form-select mb-3" id="inJenis" required>
                    <option value="" selected disabled>
                      Pilih Jenis Keanggotaan
                    </option>
                    <option value="Mahasiswa">Mahasiswa</option>
                    <option value="Dosen">Dosen</option>
                    <option value="Umum">Umum</option>
                  </select>
                  <input
                    type="submit"
                    class="btn btn-primary w-100"
                    value="Daftar"
                  />
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
