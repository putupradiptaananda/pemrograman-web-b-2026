<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-primary" style="height: 100vh">
    <div class="container">
      <div class="row d-flex min-vh-100 bg-light justify-content-center">
        <div
          class="col-xs-12 col-sm-8 col-md-6 d-flex align-items-center justify-content-center"
        >
          <div class="container">
            <div class="row">
              <div class="col">
                <h3 class="mb-4">Create an Account</h3>
                <form>
                  <div class="form-floating mb-3">
                    <input
                      type="text"
                      class="form-control"
                      id="inputUsername"
                      placeholder="Username"
                    />
                    <label for="inputUsername">Username</label>
                  </div>
                  <div class="form-floating mb-3">
                    <input
                      type="email"
                      class="form-control"
                      id="inputEmail"
                      placeholder="email@example.com"
                    />
                    <label for="inputEmail">Email</label>
                  </div>
                  <div class="row">
                    <div class="col">
                      <div class="form-floating mb-3">
                        <input
                          type="password"
                          class="form-control"
                          id="inputPass"
                          placeholder="Password"
                        />
                        <label for="inputPass">Password</label>
                      </div>
                    </div>
                    <div class="col">
                      <div class="form-floating mb-3">
                        <input
                          type="password"
                          class="form-control"
                          id="confirmPass"
                          placeholder="Confirm Password"
                        />
                        <label for="confirmPass">Confirm Password</label>
                      </div>
                    </div>
                  </div>
                  <div class="form-check mb-3">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      value=""
                      id="agreeTermsCheck"
                    />
                    <label class="form-check-label" for="agreeTermsCheck">
                      I agree to the <a href="#">terms and conditions</a>
                    </label>
                  </div>
                  <div class="d-grid">
                    <a
                      class="btn btn-primary text-uppercase fw-bold"
                      href="./index.html"
                      role="button"
                      >Register</a
                    >
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
