<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
  </head>
  <body style="height: 100vh">
    <div class="container-fluid ps-md-0" style="height: 100vh">
      <div class="row g-0 min-vh-100">
        <div class="d-none d-md-flex col-md-4 col-lg-6 bg-primary"></div>
        <div
          class="col-md-8 col-lg-6 d-flex align-items-center justify-content-center bg-light px-5"
        >
          <div class="login w-100 py-5">
            <div class="container">
              <div class="row">
                <div class="col mx-5">
                  <h3 class="login-heading mb-4">Welcome back</h3>
                  <form>
                    <div class="form-floating mb-3">
                      <input
                        type="email"
                        class="form-control"
                        id="emailInput"
                        placeholder="email@example.com"
                      />
                      <label for="emailInput">Email address</label>
                    </div>
                    <div class="form-floating mb-3">
                      <input
                        type="password"
                        class="form-control"
                        id="passwordInput"
                        placeholder="Password"
                      />
                      <label for="passwordInput">Password</label>
                    </div>
                    <div class="row">
                      <div class="col">
                        <div class="form-check mb-3">
                          <input
                            class="form-check-input"
                            type="checkbox"
                            value=""
                            id="rememberPassCheck"
                          />
                          <label
                            class="form-check-label"
                            for="rememberPassCheck"
                          >
                            Remember password
                          </label>
                        </div>
                      </div>
                      <div class="col">
                        <div class="text-end mb-3">
                          <a class="small" href="#">Forgot password?</a>
                        </div>
                      </div>
                    </div>
                    <div class="d-grid">
                      <a
                        class="btn btn-primary text-uppercase fw-bold mb-2"
                        href="./konten.html"
                        role="button"
                        >Sign in</a
                      >
                    </div>
                    <div class="text-center">
                      Don't have an account?
                      <a class="small" href="./register.html">Sign Up</a>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
